name: Loop - pull request gate

# Classifies risk, runs the review agent, and decides whether a pull request may
# merge. See docs/loop-engineering.md.
#
# SECURITY MODEL
#
# This workflow needs write access, so it must never execute pull request code.
# Two properties keep that true:
#
#   1. It is triggered by `workflow_run` (after CI finishes), by
#      `pull_request_review`, and by manual dispatch. It is NOT triggered by
#      `pull_request_target`, and it never checks out the pull request's head.
#      `actions/checkout` here takes the default branch, which is trusted.
#   2. Nothing derived from the pull request is interpolated into a shell
#      command. Untrusted values reach `bun` only through files and through
#      `actions/github-script` variables, never through `${{ }}` inside `run:`.
#
# Exactly one job, `merge`, holds `contents: write` — asking GitHub to finish a
# pull request needs it. It is safe by construction rather than by convention:
# it checks nothing out, so it has no working tree and no repository code to
# run, it has no shell step, and every step is `actions/github-script`. It acts
# only on a `decision` computed by the `gate` job from trusted state. The job
# that checks out the repository and runs the review agent stays read-only, and
# `tooling/loop/test/workflows.test.ts` fails the build if either half of that
# split is given away.
#
# A pull request from a fork is evaluated but never merged automatically; the
# gate reports `human_approval_required` for it.
#
# AUTONOMOUS RISK TIERS
#
# Risk decides how much verification a change must pass, not whether a person is
# summoned. High-risk pull requests merge automatically once they satisfy the
# high tier — which includes TWO independent review passes with no shared
# session. `human_approval_required` survives only for a fork, a change that
# weakens the loop's own protections, and the `needs:human` label.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number to re-evaluate'
        required: true
        type: number

# Default to no access; each job asks for exactly what it needs.
permissions: {}

concurrency:
  # One evaluation at a time per pull request. Not cancelled in progress: a
  # half-applied gate would leave check runs contradicting each other.
  group: >-
    loop-pr-${{
      github.event.workflow_run.head_sha
      || github.event.pull_request.number
      || inputs.pull_request
    }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.11'
  LOOP_OUTPUT_DIR: .loop
  # Checks that must succeed before an automatic merge. Keep in step with the
  # job names in ci.yml and with the repository ruleset.
  LOOP_REQUIRED_CHECKS: ${{ vars.LOOP_REQUIRED_CHECKS || 'Lint and types,Tests,Build,End-to-end' }}
  # The review agent runs on a Claude subscription token, not an API key. Its
  # presence is the whole configuration: no separate provider variable to keep in
  # step with it, and no way for the two to disagree.
  REVIEW_AGENT_AVAILABLE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
  # Bots whose events may start a review. The loop's own events come from the
  # Claude GitHub App and from github-actions; the action allows no bot by
  # default, and '*' would let any installed App trigger it, so both are named.
  LOOP_ALLOWED_BOTS: ${{ vars.LOOP_ALLOWED_BOTS || 'claude[bot],github-actions[bot]' }}

jobs:
  gate:
    name: Loop gate
    runs-on: ubuntu-latest
    # Consumed by the `merge` job below, which is deliberately a separate job so
    # that the write permission a merge needs never sits on the job that runs
    # the review agent and the repository's own code.
    outputs:
      decision: ${{ steps.evaluate.outputs.decision }}
      pull_number: ${{ steps.resolve.outputs.number }}
      found: ${{ steps.resolve.outputs.found }}
    permissions:
      contents: read # checkout the trusted default branch
      pull-requests: write # sticky comment and labels
      issues: write # lifecycle labels on the linked issue
      checks: write # publish loop/risk-gate and loop/review-gate
      # `read` for the triggering CI run, `write` because requesting a fix round
      # dispatches loop-agent-dispatch. With only `read` that step failed with
      # "Resource not accessible by integration", so a review that requested
      # changes went nowhere and the pull request simply stopped — #43 is the
      # worked example. This grants the ability to start a workflow, not to push.
      actions: write
      id-token: write # the review agent's action mints its App token via OIDC
    steps:
      - name: Resolve the pull request
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName

            let number = null
            if (event === 'workflow_dispatch') {
              number = Number(context.payload.inputs.pull_request)
            } else if (event === 'pull_request_review') {
              number = context.payload.pull_request.number
            } else {
              // `workflow_run.pull_requests` is empty for forks, so resolve by
              // head SHA instead of trusting the payload to contain it.
              const sha = context.payload.workflow_run.head_sha
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              })
              const open = data.find((pr) => pr.state === 'open')
              number = open?.number ?? null
            }

            if (number === null || Number.isNaN(number)) {
              core.info('No open pull request for this event; nothing to gate.')
              core.setOutput('found', 'false')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            })

            if (pr.state !== 'open') {
              core.info(`Pull request #${number} is ${pr.state}; nothing to gate.`)
              core.setOutput('found', 'false')
              return
            }

            core.setOutput('found', 'true')
            core.setOutput('number', String(number))
            core.setOutput('head_sha', pr.head.sha)

      - name: Check out the default branch
        if: steps.resolve.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          # Pinned, not defaulted. Some pull-request-scoped events set
          # GITHUB_REF to the merge ref, which would check out untrusted code
          # into a job holding write permissions. The gate therefore always runs
          # the default branch's logic, and a pull request cannot alter the gate
          # that judges it. The diff is fetched through the API instead.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Bun
        if: steps.resolve.outputs.found == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        if: steps.resolve.outputs.found == 'true'
        run: bun install --frozen-lockfile

      - name: Gather evaluation context
        id: context
        if: steps.resolve.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ steps.resolve.outputs.number }}
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const outputDir = process.env.LOOP_OUTPUT_DIR
            fs.mkdirSync(outputDir, { recursive: true })

            const owner = context.repo.owner
            const repo = context.repo.repo
            const pull_number = Number(process.env.PULL_NUMBER)

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })

            // The diff, fetched rather than checked out. Nothing from the pull
            // request is ever executed by this workflow.
            const diff = await github.rest.pulls.get({
              owner, repo, pull_number,
              mediaType: { format: 'diff' },
            })
            fs.writeFileSync(path.join(outputDir, 'pr.diff'), String(diff.data))
            fs.writeFileSync(path.join(outputDir, 'pr-body.md'), pr.body ?? '')

            // Check runs and commit statuses reported on the head commit.
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner, repo, ref: pr.head.sha, per_page: 100,
            })
            const checks = checkRuns.check_runs.map((run) => ({
              name: run.name,
              conclusion: run.status === 'completed' ? (run.conclusion ?? 'neutral') : 'pending',
            }))

            // Approvals from humans only. A bot approval, or the author's own,
            // must not satisfy the human gate.
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner, repo, pull_number, per_page: 100,
            })
            const latestByUser = new Map()
            for (const review of reviews) {
              if (review.user === null) continue
              latestByUser.set(review.user.login, review)
            }
            const humanApprovals = [...latestByUser.values()].filter(
              (review) =>
                review.state === 'APPROVED' &&
                review.user.type !== 'Bot' &&
                review.user.login !== pr.user?.login,
            ).length

            // Labels of the issue this pull request closes, so an issue's risk
            // label participates in classification.
            const closes = /\b(?:closes|fixes|resolves)\s+#(\d+)\b/i.exec(pr.body ?? '')
            let issueLabels = []
            if (closes !== null) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number: Number(closes[1]),
                })
                issueLabels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name ?? ''))
                fs.writeFileSync(path.join(outputDir, 'issue-body.md'), issue.body ?? '')
              } catch (error) {
                core.warning(`Could not read issue #${closes[1]}: ${error.message}`)
              }
            }

            // The loop's own state lives in a sticky comment on the pull request.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pull_number, per_page: 100,
            })
            const sticky = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes('<!-- newsdeck-loop-state -->'),
            )
            if (sticky !== undefined) core.setOutput('sticky_comment_id', String(sticky.id))

            const requiredChecks = (process.env.LOOP_REQUIRED_CHECKS ?? 'Lint and types,Tests,Build,End-to-end')
              .split(',')
              .map((name) => name.trim())
              .filter((name) => name.length > 0)

            fs.writeFileSync(
              path.join(outputDir, 'context.json'),
              JSON.stringify({
                pullRequest: {
                  number: pull_number,
                  headSha: pr.head.sha,
                  isDraft: Boolean(pr.draft),
                  isFork: pr.head.repo?.full_name !== `${owner}/${repo}`,
                  labels: pr.labels.map((l) => l.name),
                  body: pr.body ?? null,
                },
                issueLabels,
                checks,
                requiredChecks,
                humanApprovals,
                stickyComment: sticky?.body ?? null,
              }, null, 2),
            )

      # The policy as this pull request proposes it, when it changes one. Risk is
      # classified under BOTH this and the trusted default-branch policy, and
      # the stricter answer wins — so a pull request cannot lower its own risk
      # by rewriting the rules it is judged against.
      - name: Extract the proposed policy
        id: proposed_policy
        if: steps.resolve.outputs.found == 'true'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          # Read-only: fetches one blob and executes nothing from the pull request.
          git fetch --no-tags --depth=1 origin "${HEAD_SHA}" 2>/dev/null || true
          if git show "${HEAD_SHA}:.github/loop-policy.json" > .loop/proposed-policy.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm -f .loop/proposed-policy.json
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The tier has to be known before the reviewers run, because it decides
      # how many of them there are. Pure, and recomputed by the gate itself.
      - name: Classify risk
        id: classify
        if: steps.resolve.outputs.found == 'true'
        env:
          LOOP_CONTEXT: .loop/context.json
          LOOP_DIFF: .loop/pr.diff
          LOOP_POLICY: .github/loop-policy.json
          LOOP_PROPOSED_POLICY: ${{ steps.proposed_policy.outputs.found == 'true' && '.loop/proposed-policy.json' || '' }}
        run: bun tooling/loop/bin/classify-risk.ts

      - name: Build the review prompt
        if: steps.resolve.outputs.found == 'true'
        env:
          LOOP_DIFF: .loop/pr.diff
          LOOP_ISSUE_BODY: .loop/issue-body.md
          LOOP_PR_BODY: .loop/pr-body.md
        run: bun tooling/loop/bin/review-prompt.ts

      # --- Review agent -----------------------------------------------------
      # Runs on the Claude Code GitHub Action, authenticated with a Claude
      # subscription through `claude_code_oauth_token`. No Anthropic API key is
      # involved: the action's documentation states that with an OAuth token
      # "runs use your Claude subscription instead of API billing".
      #
      # The prompt is a skill committed at `.claude/skills/loop-review/`, so the
      # reviewer's instructions live in the repository and are reviewed like any
      # other code. The skill writes a JSON verdict to a file, which the gate
      # validates against `ReviewResultSchema` before reading a single field.
      #
      # `continue-on-error` is deliberate. A reviewer that crashes must not fail
      # the job — it must produce no file, so the aggregate sees fewer reviews
      # than the tier requires and blocks. Failing the job here would lose that
      # distinction.
      - name: Run the review agent
        id: review_agent
        if: steps.resolve.outputs.found == 'true' && env.REVIEW_AGENT_AVAILABLE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The loop's own events are raised by the Claude GitHub App and by
          # github-actions, both bots. Without this the action refuses to run at
          # all — its default is to allow no bot actor.
          allowed_bots: ${{ env.LOOP_ALLOWED_BOTS }}
          prompt: >-
            /loop-review ${{ github.repository }}
            ${{ steps.resolve.outputs.number }} .loop/review-a.json
          claude_args: --allowedTools "Read,Glob,Grep,Write,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh issue view *)"

      # Second, independent pass, for the high tier only. A separate action step
      # is a separate Claude Code session with no shared context: a reviewer that
      # continued the first one's conversation would be confirming its own
      # conclusions rather than checking them.
      - name: Run the second review agent
        id: review_agent_b
        if: >-
          steps.resolve.outputs.found == 'true' &&
          env.REVIEW_AGENT_AVAILABLE == 'true' &&
          steps.classify.outputs.reviewers != '1'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ env.LOOP_ALLOWED_BOTS }}
          prompt: >-
            /loop-review ${{ github.repository }}
            ${{ steps.resolve.outputs.number }} .loop/review-b.json
          claude_args: --allowedTools "Read,Glob,Grep,Write,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh issue view *)"

      - name: Record that no review agent ran
        if: steps.resolve.outputs.found == 'true' && env.REVIEW_AGENT_AVAILABLE != 'true'
        run: |
          echo "No CLAUDE_CODE_OAUTH_TOKEN secret is set, so no review agent ran." >&2
          echo "The gate will report 'blocked'. A missing review is never an approval." >&2
          echo "Generate a token with 'claude setup-token' and add it as a repository secret." >&2

      - name: Evaluate the gate
        id: evaluate
        if: steps.resolve.outputs.found == 'true'
        env:
          LOOP_CONTEXT: .loop/context.json
          LOOP_DIFF: .loop/pr.diff
          # Colon-separated, one path per independent pass. The high tier needs
          # two; a path that is listed but absent counts as a reviewer that did
          # not run, which reduces the count the aggregate sees.
          # Colon-separated, one path per independent pass the tier requires. A
          # path that is listed but absent is a reviewer that did not produce a
          # usable result, which lowers the count the aggregate sees and blocks.
          LOOP_REVIEW_OUTPUT: >-
            ${{ env.REVIEW_AGENT_AVAILABLE != 'true' && ''
            || (steps.classify.outputs.reviewers != '1' && '.loop/review-a.json:.loop/review-b.json'
            || '.loop/review-a.json') }}
          LOOP_PROPOSED_POLICY: ${{ steps.proposed_policy.outputs.found == 'true' && '.loop/proposed-policy.json' || '' }}
          LOOP_POLICY: .github/loop-policy.json
        run: bun tooling/loop/bin/evaluate-pr.ts

      - name: Publish the gate check runs
        if: steps.resolve.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RISK_GATE: ${{ steps.evaluate.outputs.risk_gate }}
          REVIEW_GATE: ${{ steps.evaluate.outputs.review_gate }}
          RISK: ${{ steps.evaluate.outputs.risk }}
          DECISION: ${{ steps.evaluate.outputs.decision }}
        with:
          script: |
            const fs = require('node:fs')
            const result = JSON.parse(fs.readFileSync('.loop/result.json', 'utf8'))
            const reasons = result.outcome.reasons.join('\n- ')

            // These two check runs are what a repository ruleset should require.
            // Enforcement then belongs to GitHub, not to this workflow: a bug
            // here cannot merge a pull request the ruleset would refuse.
            for (const [name, conclusion, title] of [
              ['loop/risk-gate', process.env.RISK_GATE, `risk: ${process.env.RISK}`],
              ['loop/review-gate', process.env.REVIEW_GATE, `review: ${result.review.status}`],
            ]) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                conclusion,
                output: {
                  title,
                  summary: `Decision: **${process.env.DECISION}**\n\n- ${reasons}`,
                },
              })
            }

      - name: Update the sticky comment and labels
        if: steps.resolve.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ steps.resolve.outputs.number }}
          STICKY_ID: ${{ steps.context.outputs.sticky_comment_id }}
          DECISION: ${{ steps.evaluate.outputs.decision }}
          RISK: ${{ steps.evaluate.outputs.risk }}
          ISSUE: ${{ steps.evaluate.outputs.issue }}
        with:
          script: |
            const fs = require('node:fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = Number(process.env.PULL_NUMBER)
            const body = fs.readFileSync('.loop/summary.md', 'utf8')

            const stickyId = process.env.STICKY_ID
            if (stickyId !== undefined && stickyId !== '') {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: Number(stickyId), body,
              })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

            // Risk label on the pull request, one value at a time.
            const risk = process.env.RISK
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number })
            const existing = pr.labels.map((l) => l.name)
            for (const stale of ['risk:low', 'risk:medium', 'risk:high']) {
              if (stale !== `risk:${risk}` && existing.includes(stale)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: stale })
              }
            }
            if (!existing.includes(`risk:${risk}`)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [`risk:${risk}`] })
            }

            // Lifecycle label on the linked issue.
            const linkedIssue = process.env.ISSUE
            if (linkedIssue !== undefined && linkedIssue !== '') {
              const decision = process.env.DECISION
              const target = decision === 'blocked' ? 'agent:blocked' : 'agent:review'
              const issueNumber = Number(linkedIssue)
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber })
              const current = issue.labels.map((l) => (typeof l === 'string' ? l : l.name ?? ''))

              for (const stale of ['agent:ready', 'agent:in-progress', 'agent:review', 'agent:blocked']) {
                if (stale !== target && current.includes(stale)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: stale })
                }
              }
              if (!current.includes(target)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: [target],
                })
              }
            }

      - name: Request the fix loop
        if: steps.resolve.outputs.found == 'true' && steps.evaluate.outputs.should_dispatch_fix == 'true'
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ steps.resolve.outputs.number }}
          ATTEMPTS: ${{ steps.evaluate.outputs.review_attempts }}
        with:
          script: |
            // The coding agent runs in its own workflow so that this one keeps
            // no ability to execute anything on a pull request's behalf.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'loop-agent-dispatch.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                mode: 'fix',
                pull_request: process.env.PULL_NUMBER,
                attempt: process.env.ATTEMPTS,
              },
            })

      - name: Write the job summary
        if: always() && steps.resolve.outputs.found == 'true'
        run: cat "$LOOP_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when the loop is blocked
        if: steps.resolve.outputs.found == 'true' && steps.evaluate.outputs.decision == 'blocked'
        run: |
          echo "The loop is blocked and needs a human. See the job summary." >&2
          exit 1

  # Asking GitHub to finish a pull request is the only thing in this workflow
  # that needs write access to the repository, so it is the only thing in this
  # job. Nothing is checked out here: the job has no working tree, runs no
  # repository code and no agent, and its single step calls two GitHub APIs.
  # That is what keeps "the loop cannot push a commit" true while still letting
  # it complete a pull request the gate approved.
  #
  # GitHub remains the authority either way. Auto-merge holds the pull request
  # until the ruleset is satisfied; the direct call is refused by the ruleset if
  # anything required is not green. This job can finish a merge GitHub would
  # already permit, and nothing more.
  merge:
    name: Merge when the gate approved
    needs: gate
    if: needs.gate.outputs.found == 'true' && needs.gate.outputs.decision == 'auto_merge'
    runs-on: ubuntu-latest
    permissions:
      contents: write # enablePullRequestAutoMerge and the merge API both write
      pull-requests: write
      actions: write # tell loop-next-issue the merge happened; see below
    steps:
      - name: Ask GitHub to merge
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ needs.gate.outputs.pull_number }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const pull_number = Number(process.env.PULL_NUMBER)

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })
            if (pr.merged) {
              core.info('Already merged.')
              return
            }

            // Every merge moves the default branch, so in a loop that merges
            // repeatedly a pull request opened minutes ago is routinely behind
            // by the time it is approved, and the ruleset requires it to be
            // current. Nothing else brings it forward, so an approved change
            // would sit at `behind` indefinitely: #36 and #40 both did.
            //
            // This is the one place the loop writes to a branch, and it can
            // only write one thing: GitHub merging this pull request's own base
            // into its head. It cannot introduce content, and the push restarts
            // CI and this gate, so the updated head is reviewed again before
            // anything merges. Returning here is what makes that happen.
            if (pr.mergeable_state === 'behind') {
              await github.rest.pulls.updateBranch({ owner, repo, pull_number })
              core.info('Branch was behind the base; updated it. CI and the gate will run again.')
              return
            }

            // Preferred, because GitHub holds the pull request until every
            // required check passes: a wrong decision here still cannot land
            // anything the ruleset would refuse.
            try {
              await github.graphql(
                `mutation ($id: ID!) {
                   enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                     clientMutationId
                   }
                 }`,
                { id: pr.node_id },
              )
              core.info('Auto-merge enabled (squash).')
              return
            } catch (error) {
              // Expected whenever nothing is left to wait for. This workflow
              // runs after CI and publishes its own two checks moments earlier,
              // so by now the pull request is usually already mergeable — and
              // GitHub refuses auto-merge on one in clean status. That is not a
              // failure; it means the merge can simply happen now.
              core.info(`Auto-merge not applicable: ${error.message}`)
            }

            try {
              await github.rest.pulls.merge({ owner, repo, pull_number, merge_method: 'squash' })
              core.info('Merged (squash).')
            } catch (error) {
              // Typically the ruleset refusing: a required check is not green,
              // or the branch is behind. Withholding a merge is a safe outcome,
              // so it is reported rather than retried or forced.
              core.warning(`GitHub declined the merge: ${error.message}`)
              core.notice('The ruleset governs this merge; nothing was forced.')
              return
            }

            // The merge just made is invisible to Actions. GitHub raises no
            // workflow events for anything GITHUB_TOKEN does, and that includes
            // a merge this job performs and a merge GitHub completes for an
            // auto-merge this job enabled. So `loop-next-issue` never sees the
            // push, the finished issue is never closed, and no next issue is
            // ever selected: the loop merges once and goes quiet.
            //
            // #40 is the worked example. It merged at 08:51:20 and no
            // `loop-next-issue` run exists for that commit, while #41 — merged
            // by auto-merge a person had enabled — did raise one.
            //
            // Saying so explicitly is the fix. `workflow_dispatch` is exempt
            // from the no-events rule, which is why the loop's own agent
            // dispatch has always worked from this same token.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'loop-next-issue.yml',
              ref: context.payload.repository.default_branch,
              inputs: { dispatch_agent: 'true' },
            })
            core.info('Asked loop-next-issue to reconcile the issue and pick the next one.')
