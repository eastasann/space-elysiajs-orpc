name: Loop - coding agent dispatch

# Runs the coding agent for one issue, in the cloud.
#
# The agent is the Claude Code GitHub Action authenticated with a Claude
# subscription token, so no Anthropic API key is involved and no machine of the
# developer's has to be awake. Its instructions are a skill committed at
# `.claude/skills/loop-implement/`, reviewed like any other code.
#
# With no CLAUDE_CODE_OAUTH_TOKEN secret the workflow says so and fails loudly,
# which is the honest signal — a loop that quietly does nothing looks identical
# to one that is working.
#
# See docs/loop-engineering.md#fully-unattended-mode.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'implement (start an issue) or fix (address review findings)'
        required: true
        type: choice
        options: [implement, fix]
      issue:
        description: 'Issue number, for mode=implement'
        required: false
        type: string
      pull_request:
        description: 'Pull request number, for mode=fix'
        required: false
        type: string
      attempt:
        description: 'Review attempt this fix responds to'
        required: false
        type: string

permissions: {}

concurrency:
  group: loop-agent-${{ inputs.issue || inputs.pull_request }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.11'
  CODING_AGENT_AVAILABLE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
  LOOP_ALLOWED_BOTS: ${{ vars.LOOP_ALLOWED_BOTS || 'claude[bot],github-actions[bot]' }}

jobs:
  dispatch:
    name: Dispatch the coding agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # lifecycle labels and the status comment
      pull-requests: write

    steps:
      - name: Validate the inputs
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          ATTEMPT: ${{ inputs.attempt }}
        with:
          script: |
            // Dispatch inputs are free-form strings. They end up in an agent
            // prompt further down, so reject anything that is not a plain
            // number before it gets there.
            const numeric = (value) => value === undefined || value === '' || /^[0-9]{1,9}$/.test(value)

            for (const [name, value] of Object.entries({
              issue: process.env.ISSUE,
              pull_request: process.env.PULL_REQUEST,
              attempt: process.env.ATTEMPT,
            })) {
              if (!numeric(value)) core.setFailed(`Input ${name} must be a number, got: ${JSON.stringify(value)}`)
            }

            const mode = process.env.MODE
            if (mode !== 'implement' && mode !== 'fix') core.setFailed(`Unknown mode: ${mode}`)
            if (mode === 'implement' && !process.env.ISSUE) core.setFailed('mode=implement needs an issue')
            if (mode === 'fix' && !process.env.PULL_REQUEST) core.setFailed('mode=fix needs a pull_request')

      - name: Report that no agent runner is configured
        if: env.CODING_AGENT_AVAILABLE != 'true'
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          ATTEMPT: ${{ inputs.attempt }}
        with:
          script: |
            const target = process.env.ISSUE || process.env.PULL_REQUEST
            const lines = [
              '### Coding agent not dispatched',
              '',
              'The loop reached the point of invoking the coding agent, but this',
              'repository has no `CLAUDE_CODE_OAUTH_TOKEN` secret.',
              '',
              `- Mode: \`${process.env.MODE}\``,
              `- Target: ${target ? `#${target}` : '(none)'}`,
              `- Review attempt: ${process.env.ATTEMPT || 'n/a'}`,
              '',
              '**To connect one**, run `claude setup-token` and add the result as the',
              'repository secret `CLAUDE_CODE_OAUTH_TOKEN`. That token authenticates',
              'with a Claude subscription, so no Anthropic API key is needed. See',
              '`docs/loop-engineering.md#fully-unattended-mode`.',
              '',
              'This issue keeps `agent:ready` and is not marked blocked: the',
              'secret is missing repository-wide, which says nothing about this',
              'issue in particular. Once it is set, the loop picks the issue up',
              'with no relabelling.',
              '',
              'Until then, implement the issue by hand. Everything else in the loop —',
              'risk classification, review, gates, merge policy, next-issue selection —',
              'runs normally on the resulting pull request.',
            ].join('\n')

            core.summary.addRaw(lines).write()

            // Deliberately no `agent:blocked` label, and this step runs before
            // the issue is claimed. A missing secret is a property of the
            // repository, not of this issue: every issue would hit it
            // identically. Blocking one would sideline it for a reason that has
            // nothing to do with it, and it would stay sidelined after the
            // secret arrived while unrelated work carried on without it —
            // exactly backwards from what block-and-continue is for. The issue
            // keeps `agent:ready`, so configuring the secret is the only thing
            // needed to pick it up.
            if (target) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(target),
                body: lines,
              })
            }

            // Fail on purpose. "Required credentials are unavailable" is an
            // explicit stop condition, and a stop condition must be visible.
            core.setFailed('No coding agent runner is configured; the loop stops here.')

      # --- The coding agent -------------------------------------------------
      # A Claude Code cloud execution, authenticated with the subscription token.
      # The action pushes and opens the pull request as the Claude GitHub App
      # rather than with GITHUB_TOKEN, which is what lets CI and the gate fire on
      # its commits — GitHub does not raise workflow events for GITHUB_TOKEN
      # pushes, and a pull request nothing runs on would stall the loop silently.

      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Claim the issue
        id: claim
        if: inputs.mode == 'implement'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = Number(process.env.ISSUE)

            if (!Number.isInteger(issue_number)) {
              core.setFailed('mode=implement requires an issue number')
              return
            }

            const { data: before } = await github.rest.issues.get({ owner, repo, issue_number })
            const labels = before.labels.map((l) => (typeof l === 'string' ? l : l.name ?? ''))

            if (before.state !== 'open') {
              core.setFailed(`Issue #${issue_number} is ${before.state}.`)
              return
            }
            if (labels.includes('agent:in-progress')) {
              core.setFailed(`Issue #${issue_number} is already claimed (agent:in-progress).`)
              return
            }
            if (labels.includes('agent:blocked')) {
              core.setFailed(`Issue #${issue_number} is blocked and needs a human.`)
              return
            }
            if (!labels.includes('agent:ready')) {
              core.setFailed(`Issue #${issue_number} does not carry agent:ready.`)
              return
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['agent:in-progress'],
            })
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'agent:ready' })
              .catch(() => {})

            // Re-read and confirm the claim. GitHub offers no compare-and-set on
            // labels, so this narrows the race rather than closing it; the
            // workflow-level concurrency group is the primary defence. The
            // limitation is documented in docs/loop-engineering.md.
            const { data: after } = await github.rest.issues.get({ owner, repo, issue_number })
            const claimed = after.labels
              .map((l) => (typeof l === 'string' ? l : l.name ?? ''))
              .includes('agent:in-progress')

            if (!claimed) {
              core.setFailed(`Could not claim issue #${issue_number}.`)
              return
            }

            core.setOutput('claimed', 'true')
            core.setOutput('title', after.title)

      - name: Run the coding agent
        id: coding_agent
        if: env.CODING_AGENT_AVAILABLE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This workflow is dispatched by the loop itself, so the triggering
          # actor is a bot. The action allows none by default.
          allowed_bots: ${{ env.LOOP_ALLOWED_BOTS }}
          branch_prefix: agent/
          prompt: >-
            ${{ inputs.mode == 'fix'
            && format('/loop-fix {0} {1}', github.repository, inputs.pull_request)
            || format('/loop-implement {0} {1}', github.repository, inputs.issue) }}

      - name: Report that the coding agent failed
        if: env.CODING_AGENT_AVAILABLE == 'true' && steps.coding_agent.outputs.conclusion != 'success'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            // A failed coding pass blocks this issue and nothing else. The loop
            // moves to independent work; leaving the issue as `agent:in-progress`
            // would strand it as neither available nor being worked on.
            const issue_number = Number(process.env.ISSUE)
            if (!Number.isInteger(issue_number)) return

            const owner = context.repo.owner
            const repo = context.repo.repo

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                '### Coding agent did not finish',
                '',
                'The run ended without success. The issue is marked `agent:blocked`',
                'so the loop moves on to independent work; nothing else waits on it.',
                '',
                `[Run log](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            })
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['agent:blocked'],
            })
            await github.rest.issues
              .removeLabel({ owner, repo, issue_number, name: 'agent:in-progress' })
              .catch(() => {})
