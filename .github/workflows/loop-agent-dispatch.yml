name: Loop - coding agent dispatch

# Runs the coding agent for one issue, in the cloud.
#
# The agent is the Claude Code GitHub Action authenticated with a Claude
# subscription token, so no Anthropic API key is involved and no machine of the
# developer's has to be awake. Its instructions are a skill committed at
# `.claude/skills/loop-implement/`, reviewed like any other code.
#
# With no CLAUDE_CODE_OAUTH_TOKEN secret the workflow says so and fails loudly,
# which is the honest signal — a loop that quietly does nothing looks identical
# to one that is working.
#
# See docs/loop-engineering.md#fully-unattended-mode.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'implement (start an issue) or fix (address review findings)'
        required: true
        type: choice
        options: [implement, fix]
      issue:
        description: 'Issue number, for mode=implement'
        required: false
        type: string
      pull_request:
        description: 'Pull request number, for mode=fix'
        required: false
        type: string
      attempt:
        description: 'Review attempt this fix responds to'
        required: false
        type: string

permissions: {}

concurrency:
  group: loop-agent-${{ inputs.issue || inputs.pull_request }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.11'
  CODING_AGENT_AVAILABLE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
  LOOP_ALLOWED_BOTS: ${{ vars.LOOP_ALLOWED_BOTS || 'claude[bot],github-actions[bot]' }}

jobs:
  dispatch:
    name: Dispatch the coding agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # lifecycle labels and the status comment
      pull-requests: write
      # The action exchanges an OIDC token for a Claude GitHub App token, and
      # that App identity is the point: GitHub raises no workflow events for a
      # GITHUB_TOKEN push, so an agent pushing with one would open pull requests
      # that nothing ever runs on. Without this the exchange fails before the
      # agent starts, with `ACTIONS_ID_TOKEN_REQUEST_URL` missing.
      id-token: write

    steps:
      - name: Validate the inputs
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          ATTEMPT: ${{ inputs.attempt }}
        with:
          script: |
            // Dispatch inputs are free-form strings. They end up in an agent
            // prompt further down, so reject anything that is not a plain
            // number before it gets there.
            const numeric = (value) => value === undefined || value === '' || /^[0-9]{1,9}$/.test(value)

            for (const [name, value] of Object.entries({
              issue: process.env.ISSUE,
              pull_request: process.env.PULL_REQUEST,
              attempt: process.env.ATTEMPT,
            })) {
              if (!numeric(value)) core.setFailed(`Input ${name} must be a number, got: ${JSON.stringify(value)}`)
            }

            const mode = process.env.MODE
            if (mode !== 'implement' && mode !== 'fix') core.setFailed(`Unknown mode: ${mode}`)
            if (mode === 'implement' && !process.env.ISSUE) core.setFailed('mode=implement needs an issue')
            if (mode === 'fix' && !process.env.PULL_REQUEST) core.setFailed('mode=fix needs a pull_request')

      - name: Report that no agent runner is configured
        if: env.CODING_AGENT_AVAILABLE != 'true'
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          ATTEMPT: ${{ inputs.attempt }}
        with:
          script: |
            const target = process.env.ISSUE || process.env.PULL_REQUEST
            const lines = [
              '### Coding agent not dispatched',
              '',
              'The loop reached the point of invoking the coding agent, but this',
              'repository has no `CLAUDE_CODE_OAUTH_TOKEN` secret.',
              '',
              `- Mode: \`${process.env.MODE}\``,
              `- Target: ${target ? `#${target}` : '(none)'}`,
              `- Review attempt: ${process.env.ATTEMPT || 'n/a'}`,
              '',
              '**To connect one**, run `claude setup-token` and add the result as the',
              'repository secret `CLAUDE_CODE_OAUTH_TOKEN`. That token authenticates',
              'with a Claude subscription, so no Anthropic API key is needed. See',
              '`docs/loop-engineering.md#fully-unattended-mode`.',
              '',
              'This issue keeps `agent:ready` and is not marked blocked: the',
              'secret is missing repository-wide, which says nothing about this',
              'issue in particular. Once it is set, the loop picks the issue up',
              'with no relabelling.',
              '',
              'Until then, implement the issue by hand. Everything else in the loop —',
              'risk classification, review, gates, merge policy, next-issue selection —',
              'runs normally on the resulting pull request.',
            ].join('\n')

            core.summary.addRaw(lines).write()

            // Deliberately no `agent:blocked` label, and this step runs before
            // the issue is claimed. A missing secret is a property of the
            // repository, not of this issue: every issue would hit it
            // identically. Blocking one would sideline it for a reason that has
            // nothing to do with it, and it would stay sidelined after the
            // secret arrived while unrelated work carried on without it —
            // exactly backwards from what block-and-continue is for. The issue
            // keeps `agent:ready`, so configuring the secret is the only thing
            // needed to pick it up.
            if (target) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(target),
                body: lines,
              })
            }

            // Fail on purpose. "Required credentials are unavailable" is an
            // explicit stop condition, and a stop condition must be visible.
            core.setFailed('No coding agent runner is configured; the loop stops here.')

      # --- The coding agent -------------------------------------------------
      # A Claude Code cloud execution, authenticated with the subscription token.
      # The action pushes and opens the pull request as the Claude GitHub App
      # rather than with GITHUB_TOKEN, which is what lets CI and the gate fire on
      # its commits — GitHub does not raise workflow events for GITHUB_TOKEN
      # pushes, and a pull request nothing runs on would stall the loop silently.

      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Claim the issue
        id: claim
        if: inputs.mode == 'implement'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = Number(process.env.ISSUE)

            if (!Number.isInteger(issue_number)) {
              core.setFailed('mode=implement requires an issue number')
              return
            }

            const { data: before } = await github.rest.issues.get({ owner, repo, issue_number })
            const labels = before.labels.map((l) => (typeof l === 'string' ? l : l.name ?? ''))

            if (before.state !== 'open') {
              core.setFailed(`Issue #${issue_number} is ${before.state}.`)
              return
            }
            if (labels.includes('agent:in-progress')) {
              core.setFailed(`Issue #${issue_number} is already claimed (agent:in-progress).`)
              return
            }
            if (labels.includes('agent:blocked')) {
              core.setFailed(`Issue #${issue_number} is blocked and needs a human.`)
              return
            }
            if (!labels.includes('agent:ready')) {
              core.setFailed(`Issue #${issue_number} does not carry agent:ready.`)
              return
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['agent:in-progress'],
            })
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'agent:ready' })
              .catch(() => {})

            // Re-read and confirm the claim. GitHub offers no compare-and-set on
            // labels, so this narrows the race rather than closing it; the
            // workflow-level concurrency group is the primary defence. The
            // limitation is documented in docs/loop-engineering.md.
            const { data: after } = await github.rest.issues.get({ owner, repo, issue_number })
            const claimed = after.labels
              .map((l) => (typeof l === 'string' ? l : l.name ?? ''))
              .includes('agent:in-progress')

            if (!claimed) {
              core.setFailed(`Could not claim issue #${issue_number}.`)
              return
            }

            core.setOutput('claimed', 'true')
            core.setOutput('title', after.title)

      - name: Run the coding agent
        id: coding_agent
        if: env.CODING_AGENT_AVAILABLE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This workflow is dispatched by the loop itself, so the triggering
          # actor is a bot. The action allows none by default.
          allowed_bots: ${{ env.LOOP_ALLOWED_BOTS }}
          branch_prefix: agent/
          prompt: >-
            ${{ inputs.mode == 'fix'
            && format('/loop-fix {0} {1}', github.repository, inputs.pull_request)
            || format('/loop-implement {0} {1}', github.repository, inputs.issue) }}

      # --- What the agent actually did --------------------------------------
      # An unattended loop must be able to answer "why did that run produce
      # nothing?". Until these steps existed it could not: the agent writes its
      # log to the runner's temp directory, which is destroyed with the runner.
      # Three runs against #46 and #50 ended `success` after 7, 11 and 15
      # minutes with no branch and no pull request, and no account of them
      # survived. See #50.

      - name: Summarise the agent run
        id: agent_log
        if: always() && env.CODING_AGENT_AVAILABLE == 'true'
        env:
          EXECUTION_LOG: ${{ runner.temp }}/claude-execution-output.json
        run: |
          if [ ! -f "$EXECUTION_LOG" ]; then
            echo "::warning title=No agent log::The agent wrote no execution log."
            exit 0
          fi

          # The log holds one `type: result` record. `..|objects` walks it
          # whether the file is an array, a stream, or a single object, so this
          # does not depend on a shape the action is free to change.
          result=$(jq -c '[.. | objects | select(.type? == "result")] | last // empty' \
            "$EXECUTION_LOG" 2>/dev/null || true)

          if [ -z "$result" ]; then
            echo "::warning title=No agent result::The execution log holds no result record."
            exit 0
          fi

          field() { printf '%s' "$result" | jq -r "(.$1 // \"n/a\") | tostring"; }

          turns=$(field num_turns)
          denials=$(field permission_denials_count)

          # Outputs, so later steps can react without re-reading the file.
          {
            echo "num_turns=$turns"
            echo "permission_denials=$denials"
            echo "subtype=$(field subtype)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Coding agent run"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | \`$(field subtype)\` |"
            echo "| Errored | \`$(field is_error)\` |"
            echo "| Turns | $turns |"
            echo "| Permission denials | $denials |"
            echo "| Duration (ms) | $(field duration_ms) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Denials and a high turn count are the two things that made the
          # silent runs hard to read, so say them out loud rather than leaving
          # them in a table nobody opens.
          if [ "$denials" != "0" ] && [ "$denials" != "n/a" ]; then
            echo "::warning title=Agent was denied permission::${denials} permission denial(s); the agent may have been unable to do what the issue asked."
          fi

      - name: Keep the agent's execution log
        if: always() && env.CODING_AGENT_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-execution-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check whether the agent left anything behind
        id: outcome
        # Only `implement` holds an issue claim that a silent run can strand. A
        # fix round pushes to a branch that already exists, so "did it produce
        # anything?" is a different question and is deliberately not answered
        # here.
        if: always() && env.CODING_AGENT_AVAILABLE == 'true' && inputs.mode == 'implement'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE)
            if (!Number.isInteger(issue_number)) {
              core.setOutput('produced', 'unknown')
              return
            }

            // The agent names its branch `agent/issue-<n>-<slug>`, and
            // sometimes `agent/issue-<n>` with no slug. Match both, and require
            // the number to end there so `agent/issue-1` does not match
            // `agent/issue-12`.
            const prefix = `agent/issue-${issue_number}`
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const produced = branches.some(
              (branch) => branch.name === prefix || branch.name.startsWith(`${prefix}-`),
            )

            core.setOutput('produced', produced ? 'true' : 'false')
            core.info(produced ? `Found a branch for #${issue_number}.` : `No branch for #${issue_number}.`)

      - name: Report that the coding agent failed
        # `always()` is load-bearing. Without a status function Actions implies
        # `success()`, which skips this step whenever a previous one failed —
        # precisely when the agent died rather than finished badly, and
        # precisely when the claim most needs clearing. Issue #4 was left
        # `agent:in-progress` with no pull request that way.
        #
        # The second clause is the other half of the same lesson. The action
        # reports `success` whenever the session ends without throwing, which
        # includes a session that ran out of turns having written nothing. That
        # is not a failure the action can see, so the claim survived it and the
        # issue was stranded exactly as a hard failure would have stranded it.
        # #46 and #50 both went that way. Ending without leaving a branch is
        # treated as not finishing, whatever the action concluded.
        if: >-
          always() && env.CODING_AGENT_AVAILABLE == 'true' &&
          (steps.coding_agent.outputs.conclusion != 'success' ||
           steps.outcome.outputs.produced == 'false')
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
          CONCLUSION: ${{ steps.coding_agent.outputs.conclusion }}
          PRODUCED: ${{ steps.outcome.outputs.produced }}
          TURNS: ${{ steps.agent_log.outputs.num_turns }}
          DENIALS: ${{ steps.agent_log.outputs.permission_denials }}
        with:
          script: |
            // A failed coding pass blocks this issue and nothing else. The loop
            // moves to independent work; leaving the issue as `agent:in-progress`
            // would strand it as neither available nor being worked on.
            const issue_number = Number(process.env.ISSUE)
            if (!Number.isInteger(issue_number)) return

            const owner = context.repo.owner
            const repo = context.repo.repo

            const ranDry = process.env.CONCLUSION === 'success' && process.env.PRODUCED === 'false'
            const numbers = [
              process.env.TURNS ? `turns: ${process.env.TURNS}` : null,
              process.env.DENIALS ? `permission denials: ${process.env.DENIALS}` : null,
            ].filter(Boolean)

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: [
                '### Coding agent did not finish',
                '',
                ranDry
                  ? 'The run ended without error but left no branch, so nothing was implemented. The issue is marked `agent:blocked` so the loop moves on to independent work; nothing else waits on it.'
                  : 'The run ended without success. The issue is marked `agent:blocked` so the loop moves on to independent work; nothing else waits on it.',
                ...(numbers.length > 0 ? ['', `Agent run: ${numbers.join(', ')}.`] : []),
                '',
                `[Run log](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) — the agent's own execution log is attached to that run as an artifact.`,
              ].join('\n'),
            })
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['agent:blocked'],
            })
            await github.rest.issues
              .removeLabel({ owner, repo, issue_number, name: 'agent:in-progress' })
              .catch(() => {})
