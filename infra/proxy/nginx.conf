# ---------------------------------------------------------------------------
# Newsdeck reverse proxy and load balancer.
#
# Two listeners, both terminating on this single container:
#
#   :8080  ->  /      user web application  (round robin over web-1, web-2)
#              /api/  application API       (round robin over api-1, api-2)
#
#   :8081  ->  /      admin application     (single instance)
#              /api/  application API       (same API pool as :8080)
#
# Admin is served on its own port rather than under a path prefix so that
# neither application needs a router basepath, and so that the admin surface can
# later be restricted at the network edge without touching application code.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Structured access logs, matching the JSON the applications emit so that one
  # request can be followed across the proxy, the web tier and the API.
  log_format newsdeck_json escape=json
    '{'
      '"service":"proxy",'
      '"time":"$time_iso8601",'
      '"requestId":"$forwarded_request_id",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"status":$status,'
      '"upstream":"$upstream_addr",'
      '"upstreamStatus":"$upstream_status",'
      '"durationMs":$request_time,'
      '"bytes":$body_bytes_sent'
    '}';

  access_log /dev/stdout newsdeck_json;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  # Adopt the caller's correlation id when it supplies one, otherwise mint the
  # id here so that every request is traceable from its very first hop.
  map $http_x_request_id $forwarded_request_id {
    ""      $request_id;
    default $http_x_request_id;
  }

  # --- Upstream pools ------------------------------------------------------
  # Instances are listed explicitly rather than relying on DNS round robin:
  # nginx resolves a name once at start-up, so a single service name with
  # several replicas would pin every request to whichever address it resolved.

  upstream newsdeck_api {
    server api-1:3001 max_fails=3 fail_timeout=10s;
    server api-2:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream newsdeck_web {
    server web-1:3000 max_fails=3 fail_timeout=10s;
    server web-2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream newsdeck_admin {
    server admin:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  # --- Shared proxy behaviour ---------------------------------------------
  proxy_http_version 1.1;
  proxy_set_header Connection        "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $forwarded_request_id;

  proxy_connect_timeout 2s;
  proxy_send_timeout    30s;
  proxy_read_timeout    30s;

  # Retry the next instance when one refuses or fails a request. This is what
  # makes losing a single replica invisible to the caller.
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  server {
    listen 8080;
    server_name _;

    # Proxy-level liveness. Deliberately answers without consulting any
    # upstream, so it reports on the proxy alone.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      # The trailing slash strips the `/api` prefix: `/api/rpc/system/status`
      # reaches the API as `/rpc/system/status`.
      proxy_pass http://newsdeck_api/;

      # Names the instance that answered. This is the header
      # `bun run verify:lb` counts.
      add_header X-Upstream-Addr $upstream_addr always;
      # X-Request-Id is deliberately NOT added here: the API sets it on its own
      # responses, and adding it again would emit the header twice.

      # The API returns discrete JSON payloads; buffering them is fine and
      # keeps slow clients off the upstream.
      proxy_buffering on;
    }

    location / {
      proxy_pass http://newsdeck_web;

      add_header X-Upstream-Addr $upstream_addr always;
      add_header X-Request-Id    $forwarded_request_id always;

      # TanStack Start streams its SSR response; buffering would hold the whole
      # document back and destroy time-to-first-byte.
      proxy_buffering off;
    }
  }

  server {
    listen 8081;
    server_name _;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://newsdeck_api/;

      add_header X-Upstream-Addr $upstream_addr always;
      # See the note on the :8080 /api/ location: the API sets this itself.

      proxy_buffering on;
    }

    location / {
      proxy_pass http://newsdeck_admin;

      add_header X-Upstream-Addr $upstream_addr always;
      add_header X-Request-Id    $forwarded_request_id always;

      proxy_buffering off;
    }
  }
}
